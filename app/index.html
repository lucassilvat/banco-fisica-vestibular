<!DOCTYPE html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="description" content="Questões de Física de vestibulares, transcritas das provas oficiais, com resolução comentada.">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Banco de Física Vestibular</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* Garantias do documento: o app não depende do esqueleto que o host acrescenta (o painel "Minha lista" e outros usam o atributo hidden). */
[hidden]:not([hidden=until-found i]) { display: none !important; }
body { margin: 0; padding: 0; }
img { max-width: 100%; }
/* Layout: filtros por tópico à esquerda; à direita, uma questão por vez como folha de caderno de prova, com navegação e seleção para a lista. */
:root {
  --bg: #eef1f4; --paper: #ffffff; --ink: #18202b; --muted: #5b6676; --line: #d5dbe3;
  --accent: #1f4fbf; --accent-ink: #ffffff; --mark: #e9785e; --mark-soft: #fbe3dc; --soft: #e4eaf6;
  --ok: #1d7a4a; --ok-soft: #dff1e7; --danger: #b3261e;
  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Source Serif 4", Georgia, "Times New Roman", serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12161c; --paper: #1a2029; --ink: #e6eaf0; --muted: #98a3b3; --line: #2c3542;
  --accent: #7ea2ff; --accent-ink: #0e1420; --mark: #f08f77; --mark-soft: #3a2621; --soft: #222c3d;
  --ok: #6fd39c; --ok-soft: #173326; --danger: #ff8a80; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #12161c; --paper: #1a2029; --ink: #e6eaf0; --muted: #98a3b3; --line: #2c3542;
  --accent: #7ea2ff; --accent-ink: #0e1420; --mark: #f08f77; --mark-soft: #3a2621; --soft: #222c3d;
  --ok: #6fd39c; --ok-soft: #173326; --danger: #ff8a80; color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-display); font-size: 15px; line-height: 1.45; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px; }
header.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 20px; padding-bottom: 16px; border-bottom: 2px solid var(--ink); margin-bottom: 20px; }
.brand h1 { margin: 0; font-size: clamp(1.5rem, 3.4vw, 2.1rem); font-weight: 800; letter-spacing: -0.02em; }
.brand p { margin: 4px 0 0; color: var(--muted); font-size: 0.92rem; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--paper); border-radius: var(--r); padding: 8px 14px; font-weight: 600; font-size: 0.9rem; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.count { font-family: var(--f-mono); font-size: 0.78rem; background: var(--mark); color: var(--paper); border-radius: 999px; padding: 1px 7px; margin-left: 6px; }

.layout { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 24px; align-items: start; }
.only-narrow { display: none !important; }
@media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr); } #filters { display: none; } #filters.open { display: block; } .only-narrow { display: inline-flex !important; } }
aside#filters { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); max-height: calc(100vh - 24px); overflow: auto; background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); }
.f-head { padding: 14px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
.label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; }
.field { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: var(--r); padding: 8px 10px; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 4px 10px; font-size: 0.82rem; font-weight: 600; }
.pill[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
details.area { border-bottom: 1px solid var(--line); }
details.area summary { list-style: none; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 700; font-size: 0.9rem; cursor: pointer; }
details.area summary::-webkit-details-marker { display: none; }
details.area summary .n { font-family: var(--f-mono); font-size: 0.75rem; color: var(--muted); font-weight: 400; }
details.area summary::after { content: "+"; font-family: var(--f-mono); color: var(--muted); }
details.area[open] summary::after { content: "−"; }
.topics { display: grid; gap: 2px; padding: 0 8px 10px; }
.topic { display: flex; align-items: flex-start; gap: 8px; padding: 6px 8px; border-radius: 4px; cursor: pointer; font-size: 0.86rem; }
.topic:hover { background: var(--soft); }
.topic input { margin-top: 3px; accent-color: var(--mark); flex: none; }
.topic span.t { flex: 1; min-width: 0; }
.topic .c { font-family: var(--f-mono); font-size: 0.72rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.topic.zero { opacity: .45; }
.topic.on { background: var(--mark-soft); }

.selbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; min-height: 34px; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--mark-soft); border: 1px solid var(--mark); border-radius: 999px; padding: 4px 6px 4px 12px; font-size: 0.84rem; font-weight: 600; }
.chip button { border: 0; background: transparent; width: 22px; height: 22px; border-radius: 50%; line-height: 1; }
.cap { font-family: var(--f-mono); color: var(--mark); }
.summary { color: var(--muted); font-size: 0.9rem; }
.summary b { color: var(--ink); font-variant-numeric: tabular-nums; }

.nav { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; background: var(--paper); border: 1px solid var(--line); border-radius: var(--r) var(--r) 0 0; padding: 10px 12px; }
.nav .pos { font-family: var(--f-mono); font-size: 0.85rem; font-variant-numeric: tabular-nums; }
.nav input[type=range] { flex: 1 1 140px; min-width: 0; accent-color: var(--accent); }
article.q { background: var(--paper); border: 1px solid var(--line); border-top: 0; border-radius: 0 0 var(--r) var(--r); }
.q-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 16px; padding: 12px 18px; border-bottom: 1px dashed var(--line); }
.q-id { font-family: var(--f-mono); font-size: 0.85rem; font-weight: 500; min-width: 0; overflow-wrap: anywhere; }
.q-id .banca { background: var(--ink); color: var(--paper); padding: 2px 8px; border-radius: 3px; margin-right: 8px; font-weight: 600; }
.sel { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: var(--r); padding: 6px 12px; font-weight: 600; font-size: 0.88rem; cursor: pointer; }
.sel input { accent-color: var(--ok); width: 16px; height: 16px; }
.sel.on { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.q-body { padding: 20px 22px 8px; }
.enunciado { font-family: var(--f-body); font-size: 1.06rem; line-height: 1.64; overflow-wrap: anywhere; max-width: 75ch; display: grid; gap: 10px; }
.enunciado .txt { white-space: pre-wrap; }
.enunciado sub, .enunciado sup, .res sub, .res sup { font-size: 0.72em; line-height: 0; }
.enunciado math, .res math { font-family: "STIX Two Math", "Cambria Math", "Latin Modern Math", math; font-size: 1.08em; padding: 0.3em 0.1em; }
.tex-err { font-family: var(--f-mono); font-size: 0.85em; color: var(--danger); }
.enunciado img.fig { max-width: min(100%, 460px); border: 1px solid var(--line); border-radius: 4px; background: #fff; padding: 4px; }
.res-wrap { margin: 8px 22px 18px; border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 10px; max-width: 75ch; }
.res { font-family: var(--f-body); font-size: 1rem; line-height: 1.6; white-space: pre-wrap; background: var(--soft); border-radius: var(--r); padding: 14px 16px; }
.res .gab { font-family: var(--f-mono); font-weight: 500; display: block; margin-top: 8px; }
.res .resp { display: block; margin-top: 8px; font-family: var(--f-body); }
.res .resp b { font-family: var(--f-mono); font-weight: 500; }
.q-tipo { font-family: var(--f-mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; border: 1px solid var(--mark); color: var(--mark); border-radius: 3px; padding: 1px 6px; margin-left: 8px; }
.q-foot { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 4px 22px 18px; }
.tag { font-size: 0.76rem; padding: 3px 9px; border-radius: 999px; background: var(--soft); border: 1px solid transparent; }
.tag.hit { background: var(--mark-soft); border-color: var(--mark); font-weight: 600; }
.orig { font-size: 0.8rem; color: var(--muted); }
.empty { background: var(--paper); border: 1px dashed var(--line); border-radius: var(--r); padding: 28px 24px; display: grid; gap: 10px; }
.empty h2 { margin: 0; font-size: 1.15rem; }
.empty p { margin: 0; color: var(--muted); font-family: var(--f-body); }

/* painel da lista */
.overlay { position: fixed; inset: 0; background: rgba(10, 14, 20, .5); display: flex; justify-content: flex-end; z-index: 20; }
.panel { background: var(--paper); width: min(100%, 460px); height: 100%; display: grid; grid-template-rows: auto auto 1fr auto; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.panel header { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); gap: 10px; }
.panel h2 { margin: 0; font-size: 1.1rem; }
.panel .opts { padding: 12px 16px; display: grid; gap: 8px; border-bottom: 1px solid var(--line); }
.panel ol { margin: 0; padding: 8px 16px 8px 36px; overflow: auto; display: grid; gap: 6px; align-content: start; }
.panel li { font-size: 0.9rem; }
.panel li .row { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.panel li button { border: 0; background: transparent; color: var(--danger); font-size: 0.82rem; }
.panel footer { padding: 14px 16px; border-top: 1px solid var(--line); display: grid; gap: 8px; }
.note { font-size: 0.82rem; color: var(--muted); margin: 0; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: var(--r); font-size: 0.9rem; z-index: 30; max-width: calc(100% - 32px); }
/* ---------- resolução animada (player) ---------- */
:root { --anim-acel: #7a45c9; --anim-luz: #f6c344; --anim-fio: #3a4452; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --anim-acel: #b892ff; --anim-luz: #ffd463; --anim-fio: #aab4c2; } }
:root[data-theme="dark"] { --anim-acel: #b892ff; --anim-luz: #ffd463; --anim-fio: #aab4c2; }
.res-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn.anim-btn { border-color: var(--accent); color: var(--accent); }
.btn.anim-btn::before { content: "▶"; font-size: 0.75em; margin-right: 7px; }
.ap-overlay { position: fixed; inset: 0; background: rgba(10, 14, 20, .6); z-index: 30; display: flex; align-items: center; justify-content: center; padding: 12px; }
.ap { background: var(--paper); color: var(--ink); width: min(1180px, 100%); max-height: 100%; border-radius: 10px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
.ap > header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 14px 18px 10px; border-bottom: 1px solid var(--line); }
.ap > header h2 { margin: 0; font-size: 1.12rem; line-height: 1.3; }
.ap .ap-sub { font-family: var(--f-mono); font-size: 0.78rem; color: var(--muted); margin-top: 3px; }
.ap .ap-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.ap .ap-chip { font-size: 0.74rem; border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; color: var(--muted); }
.ap .ap-chip.on { border-color: var(--accent); color: var(--accent); background: var(--soft); }
.ap-body { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(300px, 1fr); min-height: 0; overflow: auto; }
.ap-stage { padding: 12px 14px; display: grid; align-content: start; gap: 8px; border-right: 1px solid var(--line); background: var(--bg); }
.ap-stage svg { width: 100%; height: auto; display: block; background: var(--paper); border-radius: 8px; border: 1px solid var(--line); font-family: var(--f-display); }
.ap-step { padding: 16px 20px; overflow: auto; display: grid; align-content: start; gap: 12px; }
.ap-step .ap-conc { font-family: var(--f-mono); font-size: 0.76rem; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); }
.ap-step h3 { margin: 0; font-size: 1.15rem; }
.ap-step .ap-txt { font-family: var(--f-body); font-size: 1.02rem; line-height: 1.6; margin: 0; }
.ap-eqs { display: grid; gap: 6px; background: var(--soft); border-radius: var(--r); padding: 10px 14px; font-size: 1.08rem; }
.ap-eqs > div { opacity: 0; transform: translateY(6px); animation: apIn .45s ease forwards; }
.ap > footer { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 18px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.ap-dots { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.ap-dots button { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line); background: var(--paper); font-size: 0.75rem; font-family: var(--f-mono); padding: 0; }
.ap-dots button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.ap-dots button.done { border-color: var(--accent); }
.ap-nav { display: flex; gap: 8px; }
@media (max-width: 860px) {
  .ap-overlay { padding: 0; }
  .ap { border-radius: 0; height: 100%; }
  .ap-body { grid-template-columns: minmax(0, 1fr); }
  .ap-stage { border-right: 0; border-bottom: 1px solid var(--line); }
}
@keyframes apIn { to { opacity: 1; transform: none; } }
/* elementos da cena */
.ae { opacity: 0; transition: opacity .45s ease; pointer-events: none; }
.ae.on { opacity: 1; }
.ae.on.entra .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: apDraw .8s ease forwards; }
.ae.on.entra { animation: apFade .5s ease; }
.ae.hl { animation: apPulse 1.6s ease-in-out 2; }
@keyframes apDraw { to { stroke-dashoffset: 0; } }
@keyframes apFade { from { opacity: 0; } to { opacity: 1; } }
@keyframes apPulse { 0%, 100% { filter: none; } 50% { filter: drop-shadow(0 0 5px var(--anim-luz)) drop-shadow(0 0 2px var(--anim-luz)); } }
@media (prefers-reduced-motion: reduce) { .ae, .ae.on.entra, .ae.hl, .ap-eqs > div { animation: none !important; transition: none; opacity: 1; } .ae:not(.on) { opacity: 0; } }
.ap svg text { fill: var(--ink); font-size: 15px; }
.ap svg .t-mute { fill: var(--muted); font-size: 13px; }
.ap svg .t-b { font-weight: 700; }
.ap svg .ln { stroke: var(--ink); stroke-width: 2; fill: none; }
.ap svg .ln-mute { stroke: var(--muted); stroke-width: 1; fill: none; }
.ap svg .grid { stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 3; }
.ap svg .v-peso { stroke: var(--mark); fill: var(--mark); } .ap svg text.v-peso { stroke: none; }
.ap svg .v-normal { stroke: var(--accent); fill: var(--accent); } .ap svg text.v-normal { stroke: none; }
.ap svg .v-atrito { stroke: var(--ok); fill: var(--ok); } .ap svg text.v-atrito { stroke: none; }
.ap svg .v-acel { stroke: var(--anim-acel); fill: var(--anim-acel); } .ap svg text.v-acel { stroke: none; }
.ap svg .v-comp { stroke: var(--mark); fill: var(--mark); stroke-dasharray: 6 4; opacity: .8; } .ap svg text.v-comp { stroke: none; stroke-dasharray: none; }
.ap svg .fio { stroke: var(--anim-fio); stroke-width: 2.5; fill: none; stroke-linejoin: round; }
.ap svg .fio.aberto { stroke-dasharray: 4 5; opacity: .5; }
.ap svg .dot { fill: var(--accent); }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Banco de Física Vestibular</h1>
      <p>Questões de Física transcritas literalmente das provas oficiais, com resolução comentada.</p>
    </div>
    <div class="actions">
      <button class="btn only-narrow" id="toggleFilters" type="button" aria-expanded="false">Filtros</button>
      <button class="btn primary" id="listBtn" type="button">Minha lista<span class="count" id="listCount">0</span></button>
    </div>
  </header>

  <div class="layout">
    <aside id="filters" aria-label="Filtros">
      <div class="f-head">
        <div class="label">Banca</div>
        <div class="pills" id="bancaPills"></div>
        <div class="label">Ano</div>
        <div class="pills" id="anoPills"></div>
        <div class="label" id="tipoLabel" hidden>Tipo de questão</div>
        <div class="pills" id="tipoPills" hidden></div>
        <label class="label" for="topicSearch">Tópicos (marque vários para cruzar)</label>
        <input class="field" id="topicSearch" type="search" placeholder="Buscar tópico, ex.: Snell, Kepler">
      </div>
      <div id="areaList"></div>
    </aside>
    <main>
      <div class="selbar" id="selbar"></div>
      <div id="viewer"></div>
    </main>
  </div>
</div>

<div class="overlay" id="overlay" hidden>
  <section class="panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle">
    <header><h2 id="panelTitle">Minha lista</h2><button class="btn ghost" type="button" id="closePanel">Fechar</button></header>
    <div class="opts">
      <label class="label" for="listTitle">Título da lista</label>
      <input class="field" id="listTitle" type="text" value="Lista de exercícios — Física">
    </div>
    <ol id="listItems"></ol>
    <footer>
      <button class="btn primary" type="button" id="exportBtn">Baixar lista (.docx)</button>
      <p class="note" id="exportNote">Abre no Google Docs (Arquivo › Abrir › Fazer upload) e no Word. As questões vêm primeiro; gabarito e resoluções ficam ao final.</p>
      <button class="btn ghost" type="button" id="clearList">Esvaziar lista</button>
    </footer>
  </section>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const AREAS = [
  ["Fundamentos", ["Grandezas físicas e Sistema Internacional", "Análise dimensional", "Notação científica e ordem de grandeza", "Vetores: soma e decomposição", "Leitura e interpretação de gráficos"]],
  ["Cinemática", ["Velocidade média e aceleração média", "Movimento retilíneo uniforme (MRU)", "Movimento retilíneo uniformemente variado (MRUV)", "Gráficos do movimento (s×t, v×t, a×t)", "Queda livre e lançamento vertical", "Lançamento horizontal", "Lançamento oblíquo", "Movimento relativo e composição de velocidades", "Movimento circular uniforme (MCU)", "Período, frequência e velocidade angular", "Transmissão de movimento circular (polias, engrenagens, coroas)", "Aceleração centrípeta"]],
  ["Dinâmica", ["Leis de Newton", "Força peso e força normal", "Força de atrito estático e cinético", "Plano inclinado", "Força elástica (Lei de Hooke)", "Sistemas de blocos, fios e polias", "Resultante centrípeta (curvas, loop, globo da morte)", "Referenciais não inerciais e elevadores", "Força de arrasto e velocidade terminal"]],
  ["Energia e momento", ["Trabalho de uma força", "Potência e rendimento", "Energia cinética e teorema trabalho-energia", "Energia potencial gravitacional", "Energia potencial elástica", "Conservação da energia mecânica", "Sistemas dissipativos (perda de energia mecânica)", "Impulso e quantidade de movimento", "Conservação da quantidade de movimento", "Colisões elásticas e inelásticas", "Centro de massa"]],
  ["Gravitação", ["Lei da gravitação universal", "Leis de Kepler", "Satélites, órbitas e imponderabilidade", "Aceleração da gravidade e altitude"]],

    sLabel(el[id], X((pa + pb) / 2), yt - 13, `base menor: ${pb - pa} s`, "", "v-normal t-b");
    sArrow(el[id], "v-peso", 1.5).set(X(xAlt), Y0, X(xAlt), Y(A.vmax)); sArrow(el[id], "v-peso", 1.5).set(X(xAlt), Y(A.vmax), X(xAlt), Y0);
    sLabel(el[id], X(xAlt) + (lado > 0 ? 8 : -8), Y(A.vmax / 2), `altura: ${A.vmax} m/s`, "", "v-peso t-b", lado > 0 ? "start" : "end");
  };
  cotas("cotas-1", A1, 27, 1); cotas("cotas-2", A2, 43, -1);
  // estrada com semáforos (posições pelas áreas) e carro
  el.estrada = S("g", { class: "ae" }, svg);
  const RY = 395, SX = s => X0 + (X1 - X0) * s / sTot;
  S("rect", { x: X0 - 20, y: RY - 12, width: X1 - X0 + 40, height: 24, fill: "#59606b", rx: 3 }, el.estrada);
  S("line", { x1: X0 - 20, y1: RY, x2: X1 + 20, y2: RY, stroke: "#fff", "stroke-dasharray": "12 10", "stroke-width": 2 }, el.estrada);
  const posSem = [0]; P.paradas.slice(1).forEach(([a]) => posSem.push(sDe(a)));
  const luzes = posSem.map((s, i) => { const x = SX(s); S("rect", { x: x - 6, y: RY - 52, width: 12, height: 30, rx: 3, fill: "#222" }, el.estrada); S("line", { x1: x, y1: RY - 22, x2: x, y2: RY - 12, stroke: "#222", "stroke-width": 2 }, el.estrada); const l = S("circle", { cx: x, cy: RY - 44, r: 4.5, fill: "#e33" }, el.estrada); S("circle", { cx: x, cy: RY - 30, r: 4.5, fill: "#333" }, el.estrada); sLabel(el.estrada, x, RY - 62, `${i + 1}º`, "", "t-mute"); return l; });
  const carro = S("g", {}, el.estrada);
  S("rect", { x: -16, y: -9, width: 32, height: 12, rx: 4, fill: "#e8542f", stroke: "var(--ink)" }, carro);
  S("rect", { x: -8, y: -15, width: 16, height: 8, rx: 3, fill: "#e8542f", stroke: "var(--ink)" }, carro);
  const tPos = sLabel(el.estrada, X1, 14, "", "", "t-b", "end");
  const cursor = S("line", { y1: Y1, y2: Y0, stroke: "var(--anim-acel)", "stroke-width": 2, class: "ae" }, svg);
  const clipId = "clip" + Math.random().toString(36).slice(2);
  const clip = S("clipPath", { id: clipId }, S("defs", {}, svg)); const clipR = S("rect", { x: X0, y: 0, height: 430, width: 0 }, clip);
  const acum = S("g", { "clip-path": `url(#${clipId})`, class: "ae" }, svg);
  P.trechos.forEach(([ta, tb], i) => S("polygon", { points: pts.filter(p => p[0] >= ta && p[0] <= tb).map(p => `${X(p[0])},${Y(p[1])}`).join(" "), fill: i ? "var(--ok)" : "var(--accent)", opacity: .45 }, acum));
  let raf = 0;
  function pos(t) {
    const s = sDe(t), v = vDe(t);
    carro.setAttribute("transform", `translate(${SX(s)},${RY})`);
    luzes.forEach((l, i) => l.setAttribute("fill", Math.abs(SX(s) - SX(posSem[i])) < 2 && v < 0.01 ? "#e33" : "#3c3"));
    return s;
  }
  pos(0);
  return {
    el,
    update(est) {
      cancelAnimationFrame(raf); cursor.classList.remove("on"); acum.classList.remove("on"); tPos.textContent = "";
      if (!est.percorrer) { pos(0); return; }
      cursor.classList.add("on"); acum.classList.add("on");
      const t0 = performance.now(), dur = 9;
      const loop = now => {
        const k = ((now - t0) / 1000) % (dur + 2.5), t = Math.min(k / dur, 1) * P.tMax;

        tPos.textContent = `t = ${Math.round(t)} s · percorrido desde o 1º semáforo: ${Math.round(s)} m`;
        raf = requestAnimationFrame(loop);
      };
      raf = requestAnimationFrame(loop);
    },
    stop() { cancelAnimationFrame(raf); },
  };
};

/* Player: abre o roteiro de uma questão num painel com a cena à esquerda e o passo à direita. */
function openPlayer(q, rot) {
  const fab = CENAS[rot.cena && rot.cena.modelo];
  if (!fab) { toast("Esta resolução animada usa um modelo de cena que o app ainda não conhece."); return; }
  const ov = el("div", { class: "ap-overlay" });
  const dlg = el("section", { class: "ap", role: "dialog", "aria-modal": "true", "aria-label": "Resolução animada" });
  const chips = el("div", { class: "ap-chips" });
  (rot.conceitos || []).forEach(c => chips.append(el("span", { class: "ap-chip", text: c })));
  const close = el("button", { class: "btn ghost", type: "button", text: "Fechar" });
  dlg.append(el("header", {}, el("div", {}, el("h2", { text: rot.titulo }), el("div", { class: "ap-sub", text: "Resolução animada · " + label(q) }), chips), close));
  const svg = S("svg", { role: "img", "aria-label": "Cena da resolução" });
  const stepBox = el("div", { class: "ap-step", "aria-live": "polite" });
  dlg.append(el("div", { class: "ap-body" }, el("div", { class: "ap-stage" }, svg), stepBox));
  const dots = el("div", { class: "ap-dots" });
  const prev = el("button", { class: "btn", type: "button", text: "← Voltar" }), next = el("button", { class: "btn primary", type: "button", text: "Avançar →" });
  const again = el("button", { class: "btn ghost", type: "button", text: "↻ Repetir passo" });
  dlg.append(el("footer", {}, dots, el("div", { class: "ap-nav" }, again, prev, next)));
  ov.append(dlg); document.body.append(ov);
  let cena;
  try { cena = fab(svg, rot.cena.parametros || {}); }
  catch (e) { console.warn(e); ov.remove(); toast("Não foi possível montar a cena desta resolução."); return; }
  Object.values(cena.el).forEach(n => n.classList.add("ae"));
  const passos = rot.passos || [];
  passos.forEach((p, i) => dots.append(el("button", { type: "button", text: String(i + 1), title: p.titulo, onclick: () => show(i, i > cur) })));
  let cur = -1;
  function acumulado(k) {
    const vis = new Set(), est = {};
    for (let j = 0; j <= k; j++) { const c = passos[j].cena || {}; (c.mostrar || []).forEach(x => vis.add(x)); (c.ocultar || []).forEach(x => vis.delete(x)); Object.assign(est, c.estado || {}); }
    return { vis, est };
  }
  function show(k, animar = true) {
    const antes = cur >= 0 && animar ? acumulado(k - 1).vis : new Set();
    cur = k; const p = passos[k], { vis, est } = acumulado(k), hl = new Set((p.cena || {}).destacar || []);
    for (const [id, node] of Object.entries(cena.el)) {
      node.classList.remove("entra", "hl"); void node.getBBox;
      const on = vis.has(id); node.classList.toggle("on", on);
      if (on && animar && !antes.has(id)) { void node.offsetWidth; node.classList.add("entra"); }
      if (on && hl.has(id)) { void node.getBoundingClientRect(); node.classList.add("hl"); }
    }
    cena.update(est);
    stepBox.replaceChildren();
    if (p.conceito) stepBox.append(el("div", { class: "ap-conc", text: "Conceito · " + p.conceito }));
    stepBox.append(el("h3", { text: `${k + 1}. ${p.titulo}` }));
    const t = el("p", { class: "ap-txt" }); t.innerHTML = safeInline(p.texto || ""); stepBox.append(t);
    if ((p.equacoes || []).length) {
      const eq = el("div", { class: "ap-eqs" });
      p.equacoes.forEach((x, j) => { const d = el("div"); d.style.animationDelay = (animar ? 0.5 + j * 0.9 : 0) + "s"; d.innerHTML = mathHTML(x); eq.append(d); });
      stepBox.append(eq);
    }
    [...chips.children].forEach(c => c.classList.toggle("on", c.textContent === p.conceito));
    [...dots.children].forEach((d, i) => { d.classList.toggle("on", i === k); d.classList.toggle("done", i < k); });
    prev.disabled = k === 0; next.disabled = k === passos.length - 1;
    next.textContent = k === passos.length - 1 ? "Fim" : "Avançar →";
    stepBox.scrollTop = 0;
  }
  const fechar = () => { cena.stop(); ov.remove(); document.removeEventListener("keydown", tecla, true); state.player = null; };
  const tecla = e => {
    if (e.key === "Escape") { e.stopPropagation(); fechar(); }
    else if (e.key === "ArrowRight" && document.activeElement.type !== "range") { e.stopPropagation(); e.preventDefault(); if (cur < passos.length - 1) show(cur + 1); }
    else if (e.key === "ArrowLeft" && document.activeElement.type !== "range") { e.stopPropagation(); e.preventDefault(); if (cur > 0) show(cur - 1, false); }
  };
  document.addEventListener("keydown", tecla, true);
  close.onclick = fechar; ov.addEventListener("click", e => { if (e.target === ov) fechar(); });
  prev.onclick = () => show(cur - 1, false); next.onclick = () => show(cur + 1); again.onclick = () => show(cur, true);
  state.player = { fechar };
  show(0); next.focus();
}

/* Modo site estático: questões em questoes.json e download do .docx direto pelo navegador. */
async function loadStatic() {
  STATIC = true;
  state.downloads = { save: async ({ filename, data }) => {
    const url = URL.createObjectURL(new Blob([data], { type: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" }));
    const a = el("a", { href: url, download: filename }); document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  } };
  try {
    const r = await fetch("questoes.json", { cache: "no-cache" });
    if (!r.ok) throw new Error(r.status);
    state.qs = (await r.json()).map(q => ({ _id: q.id, ...q }));
  } catch (e) { state.qs = []; }
  try { const r = await fetch("animacoes.json", { cache: "no-cache" }); if (r.ok) state.anims = new Map(Object.entries(await r.json())); } catch (e) {}
  state.ready = true;
  const ids = new Set(state.qs.map(q => q._id));
  state.list = state.list.filter(id => ids.has(id)); saveList();
  renderAll();
}

$("listBtn").addEventListener("click", () => { renderPanel(); $("overlay").hidden = false; $("closePanel").focus(); });
$("closePanel").addEventListener("click", () => $("overlay").hidden = true);
$("overlay").addEventListener("click", e => { if (e.target === $("overlay")) $("overlay").hidden = true; });
$("clearList").addEventListener("click", () => { state.list = []; saveList(); renderPanel(); renderViewer(); });
$("topicSearch").addEventListener("input", e => { state.search = e.target.value; renderAreas(); });
$("toggleFilters").addEventListener("click", e => { const f = $("filters"); f.classList.toggle("open"); e.currentTarget.setAttribute("aria-expanded", f.classList.contains("open")); });
document.addEventListener("keydown", e => {
  if (state.player) return;
  if (e.key === "Escape") $("overlay").hidden = true;
  if (!$("overlay").hidden || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) && document.activeElement.type !== "range") return;
  if (e.key === "ArrowRight") go(1); if (e.key === "ArrowLeft") go(-1);
});

saveList();
renderAll();
(async () => {
  const c = window.claude;
  if (!c || !c.use) { await loadStatic(); return; }
  const [db, dl] = await Promise.all([c.use("db"), c.use("downloads")]);
  state.downloads = dl;
  if (!db) { state.ready = true; renderViewer(); return; }
  db.collection("questoes").onSnapshot(snap => {
    state.qs = snap.docs.map(d => ({ _id: d.id, ...d.data() }));
    state.ready = true;
    const ids = new Set(state.qs.map(q => q._id));
    const before = state.list.length; state.list = state.list.filter(id => ids.has(id)); if (state.list.length !== before) saveList();
    renderAll();
  }, () => { state.ready = true; renderViewer(); });
  db.collection("animacoes").onSnapshot(snap => {
    state.anims = new Map(snap.docs.map(d => [d.id, d.data()]));
    if (state.ready) renderViewer();
  }, () => {});
})();
</script>
